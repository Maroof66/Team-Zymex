<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Zymex — Taken Jersey Numbers</title><style>:root{color-scheme:dark}body{margin:0;background:#101412;color:#f3f5ee;font:16px system-ui;padding:24px;max-width:760px;margin:auto}h1{font-size:clamp(30px,7vw,46px)}p{color:#aab4aa}a,button{background:#c7f36b;color:#111;border:0;border-radius:10px;padding:12px 16px;font-weight:800;text-decoration:none;cursor:pointer}.panel{margin-top:24px;padding:20px;border:1px solid #303a32;border-radius:18px;background:#191f1b}.numbers{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;margin-top:20px}.num{padding:18px 8px;text-align:center;border:1px solid #43503e;border-radius:12px;font-size:25px;font-weight:900;background:#101512}.muted{color:#aab4aa;font-size:13px}</style></head><body><a href="./">← Back to registration</a><h1>Taken jersey numbers</h1><p>Numbers only are shown here to protect other players’ details.</p><section class="panel"><button id="refresh">↻ Refresh</button><p id="count">Loading…</p><div id="numbers" class="numbers"></div><p id="status" class="muted"></p></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://vyszgythhhbxszucwvyi.supabase.co','sb_publishable_YDKXRUzP6dP-6f2WnvXR-Q_zwsBoYCp');async function load(){document.getElementById('status').textContent='Checking…';const {data,error}=await sb.rpc('get_taken_jersey_numbers');if(error){document.getElementById('status').textContent='Could not load numbers. Refresh and try again.';return}const nums=(data||[]).map(x=>Number(x.jersey_number)).filter(Number.isFinite).sort((a,b)=>a-b);document.getElementById('count').textContent=nums.length+' jersey numbers currently taken';document.getElementById('numbers').innerHTML=nums.map(n=>'<div class="num">'+n+'</div>').join('')||'<p>No numbers taken yet.</p>';document.getElementById('status').textContent='Updated '+new Date().toLocaleTimeString()}document.getElementById('refresh').onclick=load;load();</script></body></html>
