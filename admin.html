<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Zymex — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{color-scheme:dark}body{margin:0;background:#101412;color:#f3f5ee;font:15px/1.5 system-ui;padding:22px;max-width:1150px;margin:auto}h1{font-size:clamp(28px,5vw,44px)}h2{margin-bottom:10px}p{color:#aab4aa}.card{background:#191f1b;border:1px solid #303a32;border-radius:16px;padding:18px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{flex:1;min-width:220px;padding:13px;border-radius:9px;background:#101512;color:white;border:1px solid #43503e}button{padding:11px 15px;border:0;border-radius:9px;background:#c7f36b;color:#111;font-weight:800;cursor:pointer}.secondary{background:#263128;color:white;border:1px solid #43503e}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{background:#263128;color:white}.tab.active{background:#c7f36b;color:#111}.hidden{display:none!important}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:12px 18px;background:#101512;border:1px solid #303a32;border-radius:12px}.stat b{font-size:25px;display:block}.pill{display:inline-block;padding:3px 8px;margin:2px;border-radius:30px;background:#273328;color:#d8efb4;font-size:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}td,th{text-align:left;padding:11px;border-bottom:1px solid #303a32}th{color:#c7f36b;text-transform:uppercase;font-size:11px}.status{color:#aab4aa;overflow-wrap:anywhere}.error{color:#ff7777}</style></head><body><div style="color:#c7f36b;font-size:12px;font-weight:900;letter-spacing:.2em">TEAM ZYMEX · ACE 2027</div><h1>Sports Week Admin</h1><section id="login" class="card"><p>Sign in with the authorized organizer email.</p><form id="loginForm" class="row"><input id="email" type="email" required placeholder="Organizer email"><button id="send">Send sign-in ring(v??'').replace(/"/g,'""')+'"',csv=[headers.map(q).join(','),...data.map(r=>headers.map(h=>q(r[h])).join(','))].join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='team-zymex-'+tab+'.csv';a.click();URL.revokeObjectURL(a.href)};sb.auth.onAuthStateChange(()=>setTimeout(check,0));check();
